server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/suara/current;
    index index.html;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/suara-demo-error.log warn;
    client_body_timeout 10s;
    client_header_timeout 10s;
    client_max_body_size 1k;
    large_client_header_buffers 2 4k;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' wss://agents.assemblyai.com; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    # Before TLS, expose liveness only. Provider-token routes exist exclusively
    # in the HTTPS server so a forged Origin cannot mint credentials in cleartext.
    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_send_timeout 12s;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /prototype {
        return 308 /prototype/;
    }

    location = /prototype/ {
        try_files /prototype/index.html =404;
    }

    location = /voice {
        return 308 /voice/;
    }

    location = /voice/ {
        try_files /voice/index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
    }

    location = /favicon.svg {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location / {
        return 404;
    }
}
